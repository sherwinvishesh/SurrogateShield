name: Tests

# Offline test suite with the core coverage gate. Runs on v2 and on pull
# requests; it never deploys or publishes. Installs need the network, the
# tests themselves do not (HF offline, no provider keys).
on:
  push:
    branches: [v2, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest-cov
      - name: Fast suite and core coverage gate
        run: >
          python -m pytest tests python-library/tests -q -p no:warnings
          --cov=python-library/surrogateshield/core --cov-fail-under=85

  package:
    # The wheel and sdist build and pass twine's metadata and long-description
    # check on every push; nothing is uploaded (the publish workflow does that
    # on a tag, from the python-lib branch).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build python-library --outdir dist
      - name: twine check
        run: twine check --strict dist/*
