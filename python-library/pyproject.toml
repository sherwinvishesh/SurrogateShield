[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogateshield"
version = "1.9.0"
description = "Privacy-preserving PII proxy — mask real data before it reaches any LLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Sherwin Vishesh Jathanna"}
]
keywords = ["privacy", "pii", "llm", "anonymization", "nlp", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "faker>=24.0.0",
    "cryptography>=42.0.0",
    "rapidfuzz>=3.6.0",
    "spacy>=3.7.0",
    "transformers>=5.0.0",
    "huggingface_hub>=0.23.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://sherwinvishesh.github.io/SurrogateShield/"
Repository = "https://github.com/sherwinvishesh/SurrogateShield"
Documentation = "https://sherwinvishesh.github.io/SurrogateShield/docs.html"
"Bug Tracker" = "https://github.com/sherwinvishesh/SurrogateShield/issues"
Paper = "https://arxiv.org/abs/2606.29567"

[project.optional-dependencies]
display = ["rich>=13.7.0"]

[project.scripts]
surrogateshield = "surrogateshield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["surrogateshield*"]

[tool.setuptools.package-data]
surrogateshield = ["py.typed", "core/detection/public_people.txt"]
